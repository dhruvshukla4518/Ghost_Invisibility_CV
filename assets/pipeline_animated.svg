<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 240" width="100%" height="100%">
  <defs>
    <linearGradient id="pipeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c17"/>
      <stop offset="100%" stop-color="#0b1326"/>
    </linearGradient>

    <linearGradient id="nodeBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#00ff87"/>
    </linearGradient>

    <filter id="pipeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes flowData {
        0% { stroke-dashoffset: 60; }
        100% { stroke-dashoffset: 0; }
      }

      @keyframes pulsePulse {
        0%, 100% { opacity: 0.5; }
        50% { opacity: 1; }
      }

      .pulse-line {
        stroke-dasharray: 6 6;
        animation: flowData 1.5s linear infinite;
      }

      .flicker {
        animation: pulsePulse 2.5s ease-in-out infinite;
      }

      .font-mono {
        font-family: 'SF Mono', 'Fira Code', 'Courier New', monospace;
      }

      .font-sans {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
    </style>
  </defs>

  <!-- Container Box -->
  <rect width="1100" height="240" rx="14" fill="url(#pipeBg)" stroke="rgba(0, 242, 254, 0.25)" stroke-width="1.5"/>

  <!-- Connecting Pathway Lines with Animated Traveling Pulses -->
  <!-- Line 1 -> 2 -->
  <line x1="160" y1="120" x2="230" y2="120" stroke="rgba(0, 242, 254, 0.2)" stroke-width="3"/>
  <line x1="160" y1="120" x2="230" y2="120" stroke="#00f2fe" stroke-width="3" class="pulse-line" filter="url(#pipeGlow)"/>

  <!-- Line 2 -> 3 -->
  <line x1="390" y1="120" x2="460" y2="120" stroke="rgba(0, 242, 254, 0.2)" stroke-width="3"/>
  <line x1="390" y1="120" x2="460" y2="120" stroke="#00ff87" stroke-width="3" class="pulse-line" filter="url(#pipeGlow)"/>

  <!-- Line 3 -> 4 -->
  <line x1="620" y1="120" x2="690" y2="120" stroke="rgba(0, 242, 254, 0.2)" stroke-width="3"/>
  <line x1="620" y1="120" x2="690" y2="120" stroke="#72e4ff" stroke-width="3" class="pulse-line" filter="url(#pipeGlow)"/>

  <!-- Line 4 -> 5 -->
  <line x1="850" y1="120" x2="920" y2="120" stroke="rgba(0, 242, 254, 0.2)" stroke-width="3"/>
  <line x1="850" y1="120" x2="920" y2="120" stroke="#00ff87" stroke-width="3" class="pulse-line" filter="url(#pipeGlow)"/>

  <!-- NODE 1: Video Input -->
  <g transform="translate(30, 60)">
    <rect width="130" height="120" rx="10" fill="#10192e" stroke="url(#nodeBorderGrad)" stroke-width="1.5"/>
    <circle cx="65" cy="35" r="18" fill="rgba(0, 242, 254, 0.15)"/>
    <text x="65" y="41" fill="#00f2fe" font-size="20" text-anchor="middle">🎥</text>
    <text x="65" y="75" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle" class="font-sans">Camera Feed</text>
    <text x="65" y="94" fill="#64748b" font-size="10" text-anchor="middle" class="font-mono">Webcam / Synth</text>
    <text x="65" y="108" fill="#00ff87" font-size="9" text-anchor="middle" class="font-mono">60 FPS · 720p</text>
  </g>

  <!-- NODE 2: Neural Segmentation -->
  <g transform="translate(230, 60)">
    <rect width="160" height="120" rx="10" fill="#10192e" stroke="url(#nodeBorderGrad)" stroke-width="1.5"/>
    <circle cx="80" cy="35" r="18" fill="rgba(0, 255, 135, 0.15)"/>
    <text x="80" y="41" fill="#00ff87" font-size="20" text-anchor="middle">🧠</text>
    <text x="80" y="75" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle" class="font-sans">MediaPipe Neural AI</text>
    <text x="80" y="94" fill="#64748b" font-size="10" text-anchor="middle" class="font-mono">Selfie Segmenter</text>
    <text x="80" y="108" fill="#00f2fe" font-size="9" text-anchor="middle" class="font-mono">Threshold = 0.4</text>
  </g>

  <!-- NODE 3: Mask Fusion & Morphology -->
  <g transform="translate(460, 60)">
    <rect width="160" height="120" rx="10" fill="#10192e" stroke="url(#nodeBorderGrad)" stroke-width="1.5"/>
    <circle cx="80" cy="35" r="18" fill="rgba(255, 200, 0, 0.15)"/>
    <text x="80" y="41" fill="#ffc800" font-size="20" text-anchor="middle">⚡</text>
    <text x="80" y="75" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle" class="font-sans">Temporal Fusion</text>
    <text x="80" y="94" fill="#64748b" font-size="10" text-anchor="middle" class="font-mono">Gaussian Soft Mask</text>
    <text x="80" y="108" fill="#ffc800" font-size="9" text-anchor="middle" class="font-mono">Clean Room Cache</text>
  </g>

  <!-- NODE 4: Multi-Mode Shaders -->
  <g transform="translate(690, 60)">
    <rect width="160" height="120" rx="10" fill="#10192e" stroke="url(#nodeBorderGrad)" stroke-width="1.5"/>
    <circle cx="80" cy="35" r="18" fill="rgba(114, 228, 255, 0.15)"/>
    <text x="80" y="41" fill="#72e4ff" font-size="20" text-anchor="middle">🔮</text>
    <text x="80" y="75" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle" class="font-sans">Shader Engines</text>
    <text x="80" y="94" fill="#64748b" font-size="10" text-anchor="middle" class="font-mono">Cloak / Ghost / Glitch</text>
    <text x="80" y="108" fill="#00ff87" font-size="9" text-anchor="middle" class="font-mono">Optical Refraction</text>
  </g>

  <!-- NODE 5: Final HUD & Output -->
  <g transform="translate(920, 60)">
    <rect width="150" height="120" rx="10" fill="#10192e" stroke="url(#nodeBorderGrad)" stroke-width="1.5"/>
    <circle cx="75" cy="35" r="18" fill="rgba(0, 255, 135, 0.15)"/>
    <text x="75" y="41" fill="#00ff87" font-size="20" text-anchor="middle">🖥️</text>
    <text x="75" y="75" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle" class="font-sans">Sci-Fi HUD &amp; Out</text>
    <text x="75" y="94" fill="#64748b" font-size="10" text-anchor="middle" class="font-mono">Real-time Telemetry</text>
    <text x="75" y="108" fill="#00f2fe" font-size="9" text-anchor="middle" class="font-mono">MP4 Rec / Streamlit</text>
  </g>

  <!-- Title Badge inside Box (Top) -->
  <g transform="translate(30, 20)">
    <circle cx="10" cy="10" r="4" fill="#00ff87" class="flicker" filter="url(#pipeGlow)"/>
    <text x="24" y="14" fill="#00f2fe" font-size="12" font-weight="700" class="font-mono">LIVE ARCHITECTURAL PIPELINE EXECUTION FLOW</text>
  </g>
</svg>
