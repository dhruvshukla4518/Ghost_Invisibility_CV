<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 24" width="100%" height="24">
  <defs>
    <linearGradient id="dividerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0"/>
      <stop offset="20%" stop-color="#00f2fe" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#00ff87" stop-opacity="1"/>
      <stop offset="80%" stop-color="#00f2fe" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="sparkGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#00ff87" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0"/>
    </radialGradient>

    <filter id="laserGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes laserMove {
        0% { transform: translateX(0px); opacity: 0; }
        15% { opacity: 1; }
        85% { opacity: 1; }
        100% { transform: translateX(1100px); opacity: 0; }
      }

      @keyframes pulseNode {
        0%, 100% { transform: scale(1); opacity: 0.7; }
        50% { transform: scale(1.4); opacity: 1; }
      }

      .spark-orb {
        animation: laserMove 3.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      .pulse-center {
        transform-origin: 600px 12px;
        animation: pulseNode 2s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Static Track Line -->
  <line x1="50" y1="12" x2="1150" y2="12" stroke="rgba(0, 242, 254, 0.15)" stroke-width="1.5"/>
  <line x1="150" y1="12" x2="1050" y2="12" stroke="url(#dividerGrad)" stroke-width="1.5" opacity="0.6"/>

  <!-- Moving Laser Spark Orb -->
  <g class="spark-orb">
    <ellipse cx="50" cy="12" rx="35" ry="6" fill="url(#sparkGrad)" filter="url(#laserGlow)"/>
    <circle cx="50" cy="12" r="3" fill="#ffffff" filter="url(#laserGlow)"/>
  </g>

  <!-- Center Holographic Diamond Reticle -->
  <g class="pulse-center">
    <polygon points="600,6 606,12 600,18 594,12" fill="#00ff87" filter="url(#laserGlow)"/>
    <circle cx="600" cy="12" r="1.5" fill="#ffffff"/>
  </g>
</svg>
